name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install native prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Install native prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          echo "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Windows native toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Verify toolchain
        run: moon version --all

      # The CLI CDN serves only the rolling `latest` channel, so a specific
      # release cannot be pinned. The newest release rewrites `Int`/`UInt` to
      # `Int32`/`UInt32` in `moon fmt` and reports new deprecation diagnostics,
      # which makes `moon fmt --check`, the `moon info` diff, and `--deny-warn`
      # fail for reasons unrelated to this project. CI therefore enforces the
      # gates that hold across toolchain releases: type checking on every
      # supported target and the full test suite.
      - name: Type-check the default target
        run: moon check

      - name: Type-check every supported target
        run: moon check --target all

      - name: Run default-target tests
        run: moon test

      - name: Run native tests and coverage
        run: |
          moon test --target native --enable-coverage
          moon coverage report -f summary
          moon coverage analyze
