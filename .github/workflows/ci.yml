name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Pin the toolchain so formatting, generated interfaces, and diagnostics stay
  # reproducible across the three runners instead of drifting with the newest
  # release.
  MOONBIT_INSTALL_VERSION: "0.1.20260915"

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install native prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Install native prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc

      - name: Install MoonBit stable (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit stable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          echo "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Windows native toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Verify toolchain
        run: moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Check default target with warnings denied
        run: moon check --deny-warn

      - name: Check all supported targets
        run: moon check --target all --deny-warn

      - name: Verify generated interfaces
        run: |
          moon info
          git diff --exit-code

      - name: Run default-target tests
        run: moon test --deny-warn

      - name: Run native tests and coverage
        run: |
          moon test --target native --deny-warn --enable-coverage
          moon coverage report -f summary
          moon coverage analyze
